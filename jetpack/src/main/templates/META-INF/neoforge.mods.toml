modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/TheSkyFell/mint-machine-mods/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/TheSkyFell/mint-machine-mods"
authors="${mod_authors}"
credits="Made for the Create: Mint & Machine modpack"
description='''
Fills the gaps between Create Stuff 'N Additions, Create SA Curios Jetpacks and Create Stuff & Netherite Additions. Adds a Curios Tank slot that refuels a jetpack worn in the Body slot; lets the Netherite Jetpack and Netherite Exoskeleton refuel from Stuff 'N Additions tanks in the inventory, Belt slot or Tank slot; and lets the Netherite Jetpack fly from the Curios Body slot.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    type="required"
    versionRange="[9,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create_sa"
    type="required"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create_nj"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create_sa_curios_jetpacks"
    type="optional"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
