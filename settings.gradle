pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mint-machine-mods'

// Compile-only copies of the other mods' classes these mods call (never packaged)
include 'stubs'

include 'economy'
include 'combat'
include 'accelerators'
include 'jetpack'
include 'opacbridge'
include 'missionpaths'
include 'aerofixes'
